name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @narad/core --filter @narad/signaling --filter @narad/license --filter @narad/billing test
      - run: pnpm -r build
      - run: pnpm --filter @narad/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/test-results }
