<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="50%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#06060d"/>
    </linearGradient>

    <!-- Accent Saffron Gradient -->
    <linearGradient id="p2p-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbe7a"/>
      <stop offset="50%" stop-color="#ff9a3d"/>
      <stop offset="100%" stop-color="#d9640f"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="device-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="p2p-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#flow-bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="220" x2="1280" y2="220"/>
    <line x1="640" y1="0" x2="640" y2="440"/>
  </g>

  <!-- ═══════════════ TOP: SIGNALING (MINIMAL) ═══════════════ -->
  <g transform="translate(480, 35)">
    <rect width="320" height="74" rx="16" fill="#141327" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <rect x="16" y="16" width="42" height="42" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    
    <!-- Cloud / Signal Tower Icon -->
    <g transform="translate(25, 25)" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M4 14.89A6 6 0 0 1 15.67 10M19 14.89A6 6 0 0 0 8.33 10"/>
      <path d="M7 17.89A3 3 0 0 1 13 15M17 17.89A3 3 0 0 0 11 15"/>
      <circle cx="12" cy="19" r="1" fill="#a78bfa"/>
    </g>

    <text x="72" y="38" fill="#f5f1e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Akash Signaling Server</text>
    <text x="72" y="56" fill="#6f6b82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Metadata &amp; SDP exchange only · ZERO storage</text>
  </g>

  <!-- Dotted lines from server to devices -->
  <path d="M 540 109 C 540 160, 240 140, 240 190" fill="none" stroke="#6f6b82" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 740 109 C 740 160, 1040 140, 1040 190" fill="none" stroke="#6f6b82" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <text x="360" y="150" fill="#6f6b82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">1. SDP Offer / Answer</text>
  <text x="920" y="150" fill="#6f6b82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">1. ICE Candidates</text>

  <!-- ═══════════════ DEVICE A: SENDER ═══════════════ -->
  <g transform="translate(100, 190)">
    <rect width="280" height="210" rx="20" fill="url(#device-bg)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#ff9a3d" fill-opacity="0.1" stroke="#ff9a3d" stroke-opacity="0.3"/>
    <g transform="translate(30, 30)" stroke="#ff9a3d" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <line x1="8" y1="21" x2="16" y2="21"/>
      <line x1="12" y1="17" x2="12" y2="21"/>
    </g>

    <text x="76" y="38" fill="#f5f1e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">Sender Device</text>
    <text x="76" y="56" fill="#a7a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Browser / Phone / Laptop</text>

    <!-- File details preview -->
    <g transform="translate(20, 80)">
      <rect width="240" height="50" rx="10" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.06"/>
      <g transform="translate(14, 13)" stroke="#ffbe7a" stroke-width="1.8" fill="none">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <polyline points="13 2 13 9 20 9"/>
      </g>
      <text x="44" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">video_4k_raw.mp4</text>
      <text x="44" y="40" fill="#8d8b98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">14.8 GB · Streaming directly</text>
    </g>

    <g transform="translate(20, 148)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <text x="0" y="14" fill="#a78bfa">Engine: <tspan fill="#cfcdd8">Pushpak Streaming</tspan></text>
      <text x="0" y="34" fill="#a78bfa">Handshake: <tspan fill="#cfcdd8">SPAKE2 on Ristretto255</tspan></text>
      <text x="0" y="54" fill="#a78bfa">Key: <tspan fill="#cfcdd8">ECDH P-256 + HKDF</tspan></text>
    </g>
  </g>

  <!-- ═══════════════ DIRECT P2P BEAM (CENTER) ═══════════════ -->
  <g transform="translate(380, 260)">
    <!-- Main Glowing P2P Pipe -->
    <line x1="0" y1="35" x2="520" y2="35" stroke="url(#p2p-beam)" stroke-width="4" filter="url(#p2p-glow)"/>
    <line x1="0" y1="35" x2="520" y2="35" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.8"/>

    <!-- Arrow head pointing right -->
    <polygon points="520,35 505,27 505,43" fill="#ff9a3d"/>

    <!-- Center Security Capsule -->
    <g transform="translate(180, 8)">
      <rect width="160" height="54" rx="27" fill="#0b0a18" stroke="#ff9a3d" stroke-width="1.5" filter="url(#p2p-glow)"/>
      
      <g transform="translate(20, 16)" stroke="#ffbe7a" stroke-width="2" fill="none">
        <rect x="3" y="9" width="14" height="9" rx="2"/>
        <path d="M6 9V6a4 4 0 0 1 8 0v3"/>
      </g>
      
      <text x="46" y="28" fill="#f5f1e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">AES-256-GCM</text>
      <text x="46" y="42" fill="#ffbe7a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">DIRECT WebRTC</text>
    </g>

    <!-- Speed & status indicators below pipe -->
    <text x="260" y="85" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Up to 800+ Mbps on local Wi-Fi · 0 Cloud Latency</text>
    <text x="260" y="104" fill="#6f6b82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Bytes stream router-direct · Never uploaded to internet</text>
  </g>

  <!-- ═══════════════ DEVICE B: RECEIVER ═══════════════ -->
  <g transform="translate(900, 190)">
    <rect width="280" height="210" rx="20" fill="url(#device-bg)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3"/>
    <g transform="translate(30, 30)" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <line x1="12" y1="18" x2="12.01" y2="18"/>
    </g>

    <text x="76" y="38" fill="#f5f1e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">Receiver Device</text>
    <text x="76" y="56" fill="#a7a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Phone / Tablet / Mac</text>

    <!-- Progress bar -->
    <g transform="translate(20, 80)">
      <rect width="240" height="50" rx="10" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="14" y="22" fill="#f5f1e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Receiving: 11.2 / 14.8 GB</text>
      <text x="226" y="22" fill="#ffbe7a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="end">76%</text>
      
      <!-- Progress track -->
      <rect x="14" y="30" width="212" height="6" rx="3" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="14" y="30" width="161" height="6" rx="3" fill="url(#p2p-beam)"/>
    </g>

    <g transform="translate(20, 148)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <text x="0" y="14" fill="#34d399">Storage: <tspan fill="#cfcdd8">Direct File System Sink</tspan></text>
      <text x="0" y="34" fill="#34d399">Integrity: <tspan fill="#cfcdd8">SHA-256 Block-by-block</tspan></text>
      <text x="0" y="54" fill="#34d399">Resumable: <tspan fill="#cfcdd8">Auto-reconnect on drop</tspan></text>
    </g>
  </g>
</svg>