# Narad self-host: web + signaling + TURN behind Caddy (automatic HTTPS).
#   cp .env.example .env && edit DOMAIN, TURN_SECRET …  then: docker compose up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [DOMAIN=${DOMAIN}]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, signaling]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args: [VITE_SIGNALING_URL=wss://signaling.${DOMAIN}/ws]
    restart: unless-stopped

  signaling:
    build:
      context: ../..
      dockerfile: apps/signaling/Dockerfile
    restart: unless-stopped
    environment:
      NARAD_PORT: 8794
      TURN_SECRET: ${TURN_SECRET}
      TURN_URLS: turn:turn.${DOMAIN}:3478?transport=udp,turn:turn.${DOMAIN}:3478?transport=tcp,turns:turn.${DOMAIN}:5349
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_STORE_FILE: /data/push.json
      AUDIT_LOG: ${AUDIT_LOG:-0}
      ROOM_CAPACITY: ${ROOM_CAPACITY:-50}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    volumes: [signaling_data:/data]

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: >
      -n --log-file=stdout --listening-port=3478 --tls-listening-port=5349
      --realm=turn.${DOMAIN} --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --fingerprint --no-multicast-peers --no-cli --min-port=49160 --max-port=49200
      --external-ip=${PUBLIC_IP}

volumes:
  caddy_data:
  signaling_data:
